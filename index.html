<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏封面主页</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }
    .hero {
      height: 100vh;
      background: url('https://picsum.photos/seed/game/1920/1080') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .hero h1 {
      font-size: 4rem;
      margin: 0;
    }
    .hero p {
      font-size: 1.3rem;
      margin-top: 10px;
    }
    .btn {
      margin-top: 30px;
      padding: 14px 32px;
      background: #e63946;
      color: white;
      border-radius: 10px;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover {
      background: #c71c2a;
    }
    .section {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      color: #ddd;
      line-height: 1.6;
    }
    .section h2 {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🔥 终焉之境：觉醒 🔥</h1>
    <p>史诗级暗黑冒险 · 次时代视觉冲击 · 动作 RPG 巅峰之作</p>
    <a class="btn" href="#start">进入世界</a>
  </div>

  <div class="section" id="start">
    <h2>游戏简介</h2>
    <p>在破碎的世界中，你将扮演觉醒者，与远古灾厄抗争。探索未知领域，收集神器，与敌对势力战斗并揭开世界背后的真相。</p>

    <h2>特色亮点</h2>
    <ul>
      <li>⚔️ 高自由度动作战斗</li>
      <li>🌌 庞大开放世界地图</li>
      <li>🎮 次世代光影与物理效果</li>
      <li>🤖 智能敌人与真实生态系统</li>
    </ul>

    <h2>发行信息</h2>
    <p>平台：PC / PS5 / Xbox Series X<br>
       预计发售：2026 年 Q1</p>
  </div>
</body>
</html>
